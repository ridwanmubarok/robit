name: Release ROBIT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.2)'
        required: true
        default: 'v0.4.2'

permissions:
  contents: write

jobs:
  build-ui:
    name: Build Frontend UI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI
        working-directory: ui
        run: npm run build
      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          retention-days: 1

  build-portable-linux:
    name: Portable Web App · Linux x64
    needs: build-ui
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend
        run: |
          RAPIDOCR_PATH=$(python3 -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))")
          pyinstaller --noconfirm --onedir \
            --name "robit-backend" \
            --add-data "core:core" \
            --add-data "routers:routers" \
            --add-data "services:services" \
            --add-data "use_cases:use_cases" \
            --add-data "ui/dist:ui/dist" \
            --add-data "$RAPIDOCR_PATH:rapidocr_onnxruntime" \
            --collect-all "rapidocr_onnxruntime" \
            --hidden-import "pyclipper" \
            --hidden-import "shapely" \
            --hidden-import "cv2" \
            --hidden-import "onnxruntime" \
            --hidden-import "yaml" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "pydantic" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "sqlite3" \
            --hidden-import "turbovec" \
            --hidden-import "sentence_transformers" \
            --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" \
            main.py

      - name: Package Portable Bundle
        run: |
          mkdir ROBIT-Portable-Linux
          mv dist/robit-backend ROBIT-Portable-Linux/backend
          echo '#!/bin/bash' > ROBIT-Portable-Linux/Start_ROBIT.sh
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> ROBIT-Portable-Linux/Start_ROBIT.sh
          echo 'echo "Starting ROBIT Local Server..."' >> ROBIT-Portable-Linux/Start_ROBIT.sh
          echo 'sleep 2 && xdg-open "http://127.0.0.1:8000" 2>/dev/null &' >> ROBIT-Portable-Linux/Start_ROBIT.sh
          echo '"$DIR/backend/robit-backend"' >> ROBIT-Portable-Linux/Start_ROBIT.sh
          chmod +x ROBIT-Portable-Linux/Start_ROBIT.sh
          tar -czvf ROBIT-Portable-Linux.tar.gz ROBIT-Portable-Linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ROBIT-Portable-Linux.tar.gz
          retention-days: 1

  build-portable-windows:
    name: Portable Web App · Windows x64
    needs: build-ui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend
        shell: pwsh
        run: |
          $RAPIDOCR_PATH = python -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))"
          pyinstaller --noconfirm --onedir --name "robit-backend" --add-data "core;core" --add-data "routers;routers" --add-data "services;services" --add-data "use_cases;use_cases" --add-data "ui/dist;ui/dist" "--add-data=$RAPIDOCR_PATH;rapidocr_onnxruntime" --collect-all "rapidocr_onnxruntime" --hidden-import "pyclipper" --hidden-import "shapely" --hidden-import "cv2" --hidden-import "onnxruntime" --hidden-import "yaml" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --hidden-import "pydantic" --hidden-import "uvicorn" --hidden-import "fastapi" --hidden-import "sqlite3" --hidden-import "turbovec" --hidden-import "sentence_transformers" --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" main.py

      - name: Package Portable Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ROBIT-Portable-Windows
          Move-Item -Path dist\robit-backend -Destination ROBIT-Portable-Windows\backend
          $launcher = "@echo off`nstart `"`" `"http://127.0.0.1:8000`"`necho Starting ROBIT Server...`n`"%~dp0backend\robit-backend.exe`""
          Set-Content -Path ROBIT-Portable-Windows\Start_ROBIT.bat -Value $launcher
          Compress-Archive -Path ROBIT-Portable-Windows -DestinationPath ROBIT-Portable-Windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ROBIT-Portable-Windows.zip
          retention-days: 1

  build-portable-macos:
    name: Portable Web App · macOS (arm64)
    needs: build-ui
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend
        run: |
          RAPIDOCR_PATH=$(python3 -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))")
          pyinstaller --noconfirm --onedir \
            --name "robit-backend" \
            --add-data "core:core" \
            --add-data "routers:routers" \
            --add-data "services:services" \
            --add-data "use_cases:use_cases" \
            --add-data "ui/dist:ui/dist" \
            --add-data "$RAPIDOCR_PATH:rapidocr_onnxruntime" \
            --collect-all "rapidocr_onnxruntime" \
            --hidden-import "pyclipper" \
            --hidden-import "shapely" \
            --hidden-import "cv2" \
            --hidden-import "onnxruntime" \
            --hidden-import "yaml" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "pydantic" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "sqlite3" \
            --hidden-import "turbovec" \
            --hidden-import "sentence_transformers" \
            --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" \
            main.py

      - name: Package Portable Bundle
        run: |
          mkdir ROBIT-Portable-macOS
          mv dist/robit-backend ROBIT-Portable-macOS/backend
          echo '#!/bin/bash' > ROBIT-Portable-macOS/Start_ROBIT.command
          echo 'DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"' >> ROBIT-Portable-macOS/Start_ROBIT.command
          echo 'echo "Starting ROBIT Local Server..."' >> ROBIT-Portable-macOS/Start_ROBIT.command
          echo 'sleep 2 && open "http://127.0.0.1:8000" &' >> ROBIT-Portable-macOS/Start_ROBIT.command
          echo '"$DIR/backend/robit-backend"' >> ROBIT-Portable-macOS/Start_ROBIT.command
          chmod +x ROBIT-Portable-macOS/Start_ROBIT.command
          tar -czvf ROBIT-Portable-macOS.tar.gz ROBIT-Portable-macOS/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ROBIT-Portable-macOS.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [build-portable-linux, build-portable-windows, build-portable-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ROBIT ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ROBIT ${{ steps.tag.outputs.tag }} (Portable Web App)

            **Privacy-first local AI workspace.**
            This release transforms ROBIT into a Portable Web Application, resolving previous issues with OS corruption and Antivirus false positives caused by native desktop wrappers.

            ### Downloads
            | Platform | File |
            |---|---|
            | Windows | `ROBIT-Portable-Windows.zip` |
            | Mac (Apple Silicon) | `ROBIT-Portable-macOS.tar.gz` |
            | Linux | `ROBIT-Portable-Linux.tar.gz` |

            ### How to use
            1. Extract the downloaded archive.
            2. Run the `Start_ROBIT` script (`.bat` on Windows, `.command` on Mac, `.sh` on Linux).
            3. A terminal will open to start the local server, and your default web browser will automatically open ROBIT!
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
