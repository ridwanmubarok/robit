name: Release ROBIT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.2)'
        required: true
        default: 'v0.4.2'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # STEP 1: Build Python backend for each OS
  # ─────────────────────────────────────────────
  build-backend-linux:
    name: Backend · Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend
        run: |
          RAPIDOCR_PATH=$(python3 -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))")
          pyinstaller --noconfirm --onefile --console \
            --name "robit-backend-x86_64-unknown-linux-gnu" \
            --add-data "core:core" \
            --add-data "routers:routers" \
            --add-data "services:services" \
            --add-data "use_cases:use_cases" \
            --add-data "$RAPIDOCR_PATH:rapidocr_onnxruntime" \
            --collect-all "rapidocr_onnxruntime" \
            --hidden-import "pyclipper" \
            --hidden-import "shapely" \
            --hidden-import "cv2" \
            --hidden-import "onnxruntime" \
            --hidden-import "yaml" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "pydantic" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "sqlite3" \
            --hidden-import "turbovec" \
            --hidden-import "sentence_transformers" \
            --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" \
            main.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-x64
          path: dist/robit-backend-x86_64-unknown-linux-gnu
          retention-days: 1

  build-backend-windows:
    name: Backend · Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend
        shell: pwsh
        run: |
          $RAPIDOCR_PATH = python -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))"
          pyinstaller --noconfirm --onefile --console --name "robit-backend-x86_64-pc-windows-msvc" --add-data "core;core" --add-data "routers;routers" --add-data "services;services" --add-data "use_cases;use_cases" "--add-data=$RAPIDOCR_PATH;rapidocr_onnxruntime" --collect-all "rapidocr_onnxruntime" --hidden-import "pyclipper" --hidden-import "shapely" --hidden-import "cv2" --hidden-import "onnxruntime" --hidden-import "yaml" --hidden-import "uvicorn.logging" --hidden-import "uvicorn.loops" --hidden-import "uvicorn.loops.auto" --hidden-import "uvicorn.protocols" --hidden-import "uvicorn.protocols.http" --hidden-import "uvicorn.protocols.http.auto" --hidden-import "uvicorn.protocols.websockets" --hidden-import "uvicorn.protocols.websockets.auto" --hidden-import "uvicorn.lifespan" --hidden-import "uvicorn.lifespan.on" --hidden-import "pydantic" --hidden-import "uvicorn" --hidden-import "fastapi" --hidden-import "sqlite3" --hidden-import "turbovec" --hidden-import "sentence_transformers" --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" main.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-windows-x64
          path: dist/robit-backend-x86_64-pc-windows-msvc.exe
          retention-days: 1

  build-backend-macos:
    name: Backend · macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build backend (arm64)
        run: |
          RAPIDOCR_PATH=$(python3 -c "import rapidocr_onnxruntime, os; print(os.path.dirname(rapidocr_onnxruntime.__file__))")
          pyinstaller --noconfirm --onefile --console \
            --name "robit-backend-aarch64-apple-darwin" \
            --add-data "core:core" \
            --add-data "routers:routers" \
            --add-data "services:services" \
            --add-data "use_cases:use_cases" \
            --add-data "$RAPIDOCR_PATH:rapidocr_onnxruntime" \
            --collect-all "rapidocr_onnxruntime" \
            --hidden-import "pyclipper" \
            --hidden-import "shapely" \
            --hidden-import "cv2" \
            --hidden-import "onnxruntime" \
            --hidden-import "yaml" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "pydantic" \
            --hidden-import "uvicorn" \
            --hidden-import "fastapi" \
            --hidden-import "sqlite3" \
            --hidden-import "turbovec" \
            --hidden-import "sentence_transformers" \
            --hidden-import "bs4" --hidden-import "websockets" --hidden-import "websockets.legacy" --hidden-import "websockets.legacy.server" --collect-all "playwright" \
            main.py

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-macos-arm64
          path: dist/robit-backend-aarch64-apple-darwin
          retention-days: 1

  # ─────────────────────────────────────────────
  # STEP 2: Build Tauri app for each OS
  # ─────────────────────────────────────────────
  build-tauri-linux:
    name: Tauri · Linux (.deb / .AppImage)
    needs: build-backend-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install Node dependencies
        working-directory: ui
        run: npm ci

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-x64
          path: ui/src-tauri/bin/

      - name: Set backend executable permission
        run: chmod +x ui/src-tauri/bin/robit-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri (Linux)
        working-directory: ui
        run: npm run tauri build -- --bundles deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            ui/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 1

  build-tauri-windows:
    name: Tauri · Windows (.msi / .exe)
    needs: build-backend-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install Node dependencies
        working-directory: ui
        run: npm ci

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-windows-x64
          path: ui/src-tauri/bin/

      - name: Build Tauri (Windows)
        working-directory: ui
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            ui/src-tauri/target/release/bundle/msi/*.msi
            ui/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

  build-tauri-macos:
    name: Tauri · macOS (.dmg)
    needs: build-backend-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust (with Apple Silicon target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install Node dependencies
        working-directory: ui
        run: npm ci

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-macos-arm64
          path: ui/src-tauri/bin/

      - name: Set backend executable permission
        run: chmod +x ui/src-tauri/bin/robit-backend-aarch64-apple-darwin

      - name: Build Tauri (macOS)
        working-directory: ui
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            ui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 1

  # ─────────────────────────────────────────────
  # STEP 3: Create GitHub Release
  # ─────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [build-tauri-linux, build-tauri-windows, build-tauri-macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets/

      - name: List release assets
        run: ls -lh release-assets/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "ROBIT ${{ steps.tag.outputs.tag }}"
          draft: false
          body_path: release_body.md
          prerelease: false
          generate_release_notes: true
          body: |
            ## ROBIT ${{ steps.tag.outputs.tag }}

            **Privacy-first local AI workspace.**

            ### Downloads
            | Platform | File | Notes |
            |---|---|---|
            | Linux | `.AppImage` | Universal, portable |
            | Linux | `.deb` | Debian/Ubuntu |
            | Windows | `.msi` | Recommended |
            | Windows | `.exe` | NSIS installer |
            | Mac | `.dmg` | Apple Silicon (M1/M2/M3) |

            ### First Run
            The app will guide you through setup:
            1. Download the AI Engine (Llama.cpp, ~30 MB)
            2. Browse and import your `.gguf` model file
            3. Start chatting locally — no cloud, no data sent out
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
